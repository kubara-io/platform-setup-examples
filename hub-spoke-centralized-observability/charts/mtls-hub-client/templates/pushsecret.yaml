apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: telemetry-client-{{ required "spokeName is required" .Values.spokeName }}
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 10s
  updatePolicy: Replace
  deletionPolicy: None

  secretStoreRefs:
    - name: {{ .Values.secretStore.name }}
      kind: {{ .Values.secretStore.kind }}

  selector:
    secret:
      name: telemetry-client-{{ .Values.spokeName }}

  dataTo:
    - storeRef:
        name: {{ .Values.secretStore.name }}
        kind: {{ .Values.secretStore.kind }}
      remoteKey: {{ printf "%s/%s" .Values.remoteKeyPrefix .Values.spokeName | quote }}
      match:
        regexp: '^(ca\.crt|tls\.crt|tls\.key)$'
