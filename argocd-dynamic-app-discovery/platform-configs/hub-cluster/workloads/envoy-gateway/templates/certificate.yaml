apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: envoy-gateway
spec:
  secretName: {{ .Values.tls.secretName }}
  dnsNames:
    - {{ required "tls.hostname is required" .Values.tls.hostname | quote }}
  issuerRef:
    name: {{ required "tls.issuerRef.name is required" .Values.tls.issuerRef.name }}
    kind: {{ required "tls.issuerRef.kind is required" .Values.tls.issuerRef.kind }}
