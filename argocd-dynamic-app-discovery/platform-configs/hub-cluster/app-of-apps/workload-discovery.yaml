apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-discovery
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/your-org/your-platform-repo.git
        revision: main
        directories:
          - path: platform-configs/hub-cluster/workloads/*
  template:
    metadata:
      name: '{{ .path.basename }}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: hub-cluster-dev
      source:
        repoURL: https://github.com/your-org/your-platform-repo.git
        targetRevision: main
        path: '{{ .path.path }}'
        helm:
          releaseName: '{{ .path.basename }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
